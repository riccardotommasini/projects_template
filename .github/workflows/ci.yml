name: CI

on:
  push:
    branches:
      - develop
      - "feature/**"
      - "ci/**"
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Compile and test Python code
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          for requirements_file in requirements.txt orchestration/requirements.txt backend/requirements.txt; do
            if [ -f "$requirements_file" ]; then
              python -m pip install -r "$requirements_file"
            fi
          done
          python -m pip install pytest httpx2

      - name: Compile Python files
        run: python -m compileall -q ingestion warehouse orchestration backend

      - name: Run tests
        run: python -m pytest -q

