name: CI

on:
  push:
    branches:
      - develop
      - "feature/**"
      - "ci/**"
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Compile and test Python code
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install ingestion and warehouse dependencies
        if: hashFiles('requirements.txt') != ''
        run: python -m pip install -r requirements.txt

      - name: Install orchestration dependencies
        if: hashFiles('orchestration/requirements.txt') != ''
        run: python -m pip install -r orchestration/requirements.txt

      - name: Install backend dependencies
        if: hashFiles('backend/requirements.txt') != ''
        run: python -m pip install -r backend/requirements.txt

      - name: Install test dependencies
        # Starlette's TestClient requires httpx2 in the current backend stack.
        run: |
          python -m pip install pytest httpx2

      - name: Compile Python files
        run: python -m compileall -q ingestion warehouse orchestration backend

      - name: Run tests
        run: python -m pytest -q

