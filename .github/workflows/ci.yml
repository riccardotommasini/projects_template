name: CI

on:
  push:
    branches:
      - develop
      - "feature/**"
      - "ci/**"
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Compile and test Python code
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install orchestration dependencies
        if: hashFiles('orchestration/requirements.txt') != ''
        run: python -m pip install -r orchestration/requirements.txt

      - name: Install backend dependencies
        if: hashFiles('backend/requirements.txt') != ''
        run: python -m pip install -r backend/requirements.txt

      - name: Install test dependencies
        # Starlette's TestClient requires httpx in the backend test suite.
        run: |
          python -m pip install pytest httpx

      - name: Compile Python files
        run: python -m compileall -q ingestion warehouse orchestration backend

      - name: Run tests
        run: python -m pytest -q

  airflow-validation:
    name: Validate Docker Compose and Airflow DAGs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Create CI environment file
        run: cp .env.example .env.ci

      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.ci config --quiet

      - name: Build Airflow image
        run: docker compose --env-file .env.ci build airflow-init

      - name: Initialize Airflow metadata database
        run: |
          docker compose --env-file .env.ci up -d postgres
          docker compose --env-file .env.ci run --rm airflow-init

      - name: Check DAG import errors
        run: docker compose --env-file .env.ci run --rm --no-deps --user airflow --entrypoint airflow airflow-init dags list-import-errors

      - name: Stop CI services
        if: always()
        run: docker compose --env-file .env.ci down -v

